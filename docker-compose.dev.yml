services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:16
    env_file:
      - ./back/.env.dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  worker:
    build:
      context: .
      dockerfile: ./back/Dockerfile.backend.dev

    env_file:
      - ./back/.env.dev

    volumes:
      - ./back:/app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    command: python manage.py qcluster



volumes:
  postgres_data: